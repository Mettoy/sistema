<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administrar Usuarios</title>
  <style>
    /* Estilos base (puedes conservar los anteriores o copiar esto si partes de cero) */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      background-color: #f7f7f7;
    }

    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      margin-bottom: 15px;
      text-decoration: none;
      font-size: 18px;
    }

    .container {
      padding: 40px;
      flex-grow: 1;
    }

    .user-item {
      background: #ecf0f1;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .user-controls {
      margin-top: 10px;
    }

    button {
      margin-right: 8px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove {
      background-color: #e74c3c;
      color: white;
    }

    .toggle {
      background-color: #3498db;
      color: white;
    }

    .access-denied {
      background-color: #f39c12;
      color: white;
    }

    .give-access {
      background-color: #27ae60;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Menú</h2>
    <a href="inicio.html">Inicio</a>
    <a href="agregar.html">Agregar Usuario</a>
  </div>

  <div class="container">
    <h2>Usuarios registrados</h2>
    <input type="text" id="nuevoUsuario" placeholder="Nombre de usuario">
    <button onclick="agregarUsuario()">Agregar</button>

    <div id="listaUsuarios"></div>
  </div>

  <script>
    function cargarUsuarios() {
      const contenedor = document.getElementById("listaUsuarios");
      const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      contenedor.innerHTML = "";

      usuarios.forEach((usuario, index) => {
        const div = document.createElement("div");
        div.classList.add("user-item");

        const nombre = usuario.nombre || usuario;
        const acceso = usuario.acceso !== false; // por defecto true
        const permisos = usuario.permisos?.join(", ") || "Sin permisos";

        div.innerHTML = `
          <strong>${nombre}</strong> - Permisos: ${permisos}<br>
          Acceso: <span style="color:${acceso ? 'green' : 'red'};">${acceso ? 'Permitido' : 'Denegado'}</span>
          <div class="user-controls">
            <button class="toggle" onclick="agregarNombre(${index})">Agregar nombre</button>
            <button class="toggle" onclick="asignarPermisos(${index})">Agregar permisos</button>
            ${acceso 
              ? `<button class="access-denied" onclick="revocarAcceso(${index})">Quitar acceso</button>`
              : `<button class="give-access" onclick="darAcceso(${index})">Dar acceso</button>`
            }
          </div>
        `;

        contenedor.appendChild(div);
      });
    }

    function agregarUsuario() {
      const input = document.getElementById("nuevoUsuario");
      const nombre = input.value.trim().toLowerCase();
      if (!nombre) {
        alert("Debes ingresar un nombre");
        return;
      }

      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      if (usuarios.find(u => u.nombre === nombre || u === nombre)) {
        alert("Usuario ya existe");
        return;
      }

      usuarios.push({ nombre: nombre, permisos: [], acceso: true });
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      input.value = "";
      cargarUsuarios();
    }

    function agregarNombre(index) {
      const nuevoNombre = prompt("Ingresa el nuevo nombre para este usuario:");
      if (!nuevoNombre) return;

      let usuarios = JSON.parse(localStorage.getItem("usuarios"));
      usuarios[index].nombre = nuevoNombre.trim().toLowerCase();
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function asignarPermisos(index) {
      const opciones = ["Acceso Total", "Acceso Normal", "Discipulado", "Ofrendas"];
      const seleccion = prompt(`Selecciona un permiso:\n${opciones.join("\n")}`);
      if (!seleccion) return;

      let usuarios = JSON.parse(localStorage.getItem("usuarios"));
      if (!usuarios[index].permisos) usuarios[index].permisos = [];
      usuarios[index].permisos.push(seleccion);
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function revocarAcceso(index) {
      const confirmacion = confirm("¿Estás seguro que quieres quitar el acceso a este usuario?");
      if (!confirmacion) return;

      let usuarios = JSON.parse(localStorage.getItem("usuarios"));
      usuarios[index].acceso = false;
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function darAcceso(index) {
      let usuarios = JSON.parse(localStorage.getItem("usuarios"));
      usuarios[index].acceso = true;
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      cargarUsuarios();
    }

    window.onload = cargarUsuarios;
  </script>
</body>
</html>
