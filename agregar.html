<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agregar Usuarios</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: background 0.2s;
    }

    .sidebar a:hover {
      background-color: #3c5a72;
    }

    .content {
      margin-left: 240px;
      padding: 30px;
    }

    input[type="text"] {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      font-size: 14px;
      margin: 5px;
      cursor: pointer;
    }

    .user-entry {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .user-controls button {
      margin-right: 5px;
    }

    .permisos-box {
      margin-top: 10px;
    }

    .disabled {
      color: red;
    }

    .enabled {
      color: green;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>Gestión de Usuarios</div>
  </div>

  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="agregar.html">Agregar Usuario</a>
  </div>

  <div class="content">
    <h2>Agregar usuarios autorizados</h2>
    <input type="text" id="nuevoUsuario" placeholder="Nombre de usuario (sin espacios)" />
    <button onclick="agregarUsuario()">Agregar</button>

    <h3>Usuarios registrados:</h3>
    <div id="listaUsuarios"></div>
  </div>

  <script>
    function cargarUsuarios() {
      const lista = document.getElementById('listaUsuarios');
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

      lista.innerHTML = '';

      usuarios.forEach((usuario, index) => {
        const div = document.createElement('div');
        div.className = 'user-entry';

        const nombreUsuario = typeof usuario === 'object' ? usuario.nombre : usuario;
        const nombreVisible = typeof usuario === 'object' ? usuario.nombreVisible || '(sin nombre)' : '';
        const acceso = typeof usuario === 'object' ? usuario.acceso !== false : true;
        const permisos = typeof usuario === 'object' && usuario.permisos ? usuario.permisos.join(', ') : 'Ninguno';

        div.innerHTML = `
          <strong>${nombreUsuario}</strong> - Nombre visible: ${nombreVisible}<br>
          Permisos: ${permisos}<br>
          Acceso: <span class="${acceso ? 'enabled' : 'disabled'}">${acceso ? 'Permitido' : 'Denegado'}</span><br>
          <div class="user-controls">
            <button onclick="agregarNombre(${index})">Agregar nombre</button>
            <button onclick="asignarPermisos(${index})">Agregar permisos</button>
            ${nombreUsuario !== 'admon' 
              ? acceso 
                ? `<button onclick="revocarAcceso(${index})">Quitar acceso</button>
                   <button onclick="eliminarUsuario(${index})">Eliminar</button>`
                : `<button onclick="darAcceso(${index})">Dar acceso</button>`
              : '<em>No se puede modificar el administrador</em>'
            }
          </div>
        `;
        lista.appendChild(div);
      });
    }

    function agregarUsuario() {
      const input = document.getElementById('nuevoUsuario');
      let usuario = input.value.trim().toLowerCase();
      if (usuario === '') return alert('Debes escribir un nombre de usuario.');

      let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

      if (usuarios.some(u => typeof u === 'object' ? u.nombre === usuario : u === usuario)) {
        alert('El usuario ya está registrado.');
        return;
      }

      usuarios.push({ nombre: usuario, acceso: true, permisos: [], nombreVisible: '' });
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      input.value = '';
      cargarUsuarios();
    }

    function agregarNombre(index) {
      const nombreVisible = prompt('Ingresa el nombre visible para este usuario:');
      if (!nombreVisible) return;

      let usuarios = JSON.parse(localStorage.getItem('usuarios'));
      usuarios[index].nombreVisible = nombreVisible.trim();
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function asignarPermisos(index) {
      const opciones = ['Acceso total', 'Discipulado', 'Ofrendas', 'Acceso normal'];
      const seleccionados = prompt(
        `Escribe los permisos separados por coma:\n${opciones.join(', ')}`
      );

      if (!seleccionados) return;

      let permisos = seleccionados
        .split(',')
        .map(p => p.trim())
        .filter(p => opciones.includes(p));

      let usuarios = JSON.parse(localStorage.getItem('usuarios'));
      usuarios[index].permisos = permisos;
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function revocarAcceso(index) {
      let usuarios = JSON.parse(localStorage.getItem('usuarios'));
      usuarios[index].acceso = false;
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function darAcceso(index) {
      let usuarios = JSON.parse(localStorage.getItem('usuarios'));
      usuarios[index].acceso = true;
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      cargarUsuarios();
    }

    function eliminarUsuario(index) {
      let usuarios = JSON.parse(localStorage.getItem('usuarios'));
      if (usuarios[index].nombre === 'admon') {
        alert('No puedes eliminar al administrador.');
        return;
      }
      if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
        usuarios.splice(index, 1);
        localStorage.setItem('usuarios', JSON.stringify(usuarios));
        cargarUsuarios();
      }
    }

    window.onload = cargarUsuarios;
  </script>
</body>
</html>
