<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .logo-img {
      width: 250px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .logo-img:hover {
      transform: scale(1.05);
    }

    input[type="text"] {
      padding: 10px;
      width: 100%;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .hidden-submit {
      display: none;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <form onsubmit="verificarUsuario(); return false;">
      <img 
        src="https://cdn.create.vista.com/api/media/small/84022132/stock-photo-bar-loading-with-the-text-jesus" 
        alt="Ingresar" 
        class="logo-img"
        onclick="verificarUsuario()"
      >

      <input type="text" id="usuario" placeholder="Nombre de usuario" autocomplete="off" />
      <input type="submit" class="hidden-submit" />

      <div id="mensajeError" class="error-message"></div>
    </form>
  </div>

  <script>
    function verificarUsuario() {
      const usuarioIngresado = document.getElementById('usuario').value.trim().toLowerCase();
      const mensajeError = document.getElementById('mensajeError');
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

      let usuario = usuarios.find(u => 
        typeof u === 'object' && u.nombre === usuarioIngresado && u.acceso !== false
      );

      if (usuarioIngresado === 'jbenjamin') {
        localStorage.setItem('usuarioActual', JSON.stringify({
          nombre: 'jbenjamin',
          nombreVisible: 'Administrador'
        }));
        window.location.href = 'inicio.html';
      } else if (usuario) {
        localStorage.setItem('usuarioActual', JSON.stringify(usuario));
        window.location.href = 'inicio.html';
      } else {
        mensajeError.textContent = 'Acceso denegado. Usuario inválido o sin permiso.';
      }
    }
  </script>

</body>
</html>
