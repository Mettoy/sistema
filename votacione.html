<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Votaciones</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    table {
      width: 50%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
      margin-right: 10px;
    }
    #historial {
      width: 60%;
      border: 1px solid #aaa;
      padding: 10px;
      background-color: #fafafa;
    }
  </style>
</head>
<body>

  <h2>Panel de Votación</h2>
  
  <button onclick="iniciarVotacion()" id="btnIniciar">Iniciar Votación</button>

  <table id="tablaVotos">
    <thead>
      <tr>
        <th>Candidato</th>
        <th>Votos</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Juan Pérez</td>
        <td id="votos-juan">0</td>
        <td><button onclick="votar('juan')" disabled id="btn-juan">Votar</button></td>
      </tr>
      <tr>
        <td>María Gómez</td>
        <td id="votos-maria">0</td>
        <td><button onclick="votar('maria')" disabled id="btn-maria">Votar</button></td>
      </tr>
      <tr>
        <td>Luis Torres</td>
        <td id="votos-luis">0</td>
        <td><button onclick="votar('luis')" disabled id="btn-luis">Votar</button></td>
      </tr>
    </tbody>
  </table>

  <h3>Historial de Votaciones</h3>
  <div id="historial">
    <p><em>No hay votos registrados aún.</em></p>
  </div>

  <script>
    function iniciarVotacion() {
      document.getElementById("btn-juan").disabled = false;
      document.getElementById("btn-maria").disabled = false;
      document.getElementById("btn-luis").disabled = false;
      document.getElementById("btnIniciar").disabled = true;
    }

    function votar(candidato) {
      const votosId = "votos-" + candidato;
      let votosElemento = document.getElementById(votosId);
      let votos = parseInt(votosElemento.textContent) + 1;
      votosElemento.textContent = votos;

      const nombre = {
        juan: "Juan Pérez",
        maria: "María Gómez",
        luis: "Luis Torres"
      }[candidato];

      const historial = document.getElementById("historial");
      const hora = new Date().toLocaleTimeString();
      const nuevoRegistro = document.createElement("p");
      nuevoRegistro.textContent = `🗳️ ${nombre} recibió un voto a las ${hora}.`;
      historial.appendChild(nuevoRegistro);
    }
  </script>

</body>
</html>
