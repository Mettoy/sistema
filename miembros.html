<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miembros</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a, .sidebar button {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    .sidebar a:hover,
    .sidebar button:hover {
      background-color: #3c5a72;
    }

    .content {
      margin-left: 240px;
      padding: 30px;
    }

    .search-box {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .search-box input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-right: 10px;
    }

    .search-box button {
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-box button img {
      width: 20px;
      height: 20px;
    }

    .add-member-button {
      margin-left: 10px;
      padding: 6px 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    .add-member-button:hover {
      background-color: #27ae60;
    }

    .add-member-button img {
      margin-left: 8px;
    }

    .members-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    .members-table th, .members-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .members-table th {
      background-color: #34495e;
      color: white;
    }

    .members-table td img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .members-table td input {
      padding: 5px;
      font-size: 16px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .members-table td .edit-btn,
    .members-table td .delete-btn {
      background-color: #f39c12;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .members-table td .edit-btn:hover {
      background-color: #e67e22;
    }

    .members-table td .delete-btn {
      background-color: red;
    }

    .members-table td .delete-btn:hover {
      background-color: #c0392b;
    }

    .members-table td .edit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Estilos para el formulario emergente */
    .form-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background-color: white;
      padding: 20px;
      width: 400px;
      border-radius: 8px;
      position: relative;
    }

    .form-container h3 {
      margin-top: 0;
      text-align: center;
    }

    .form-container input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .form-container button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      margin-right: 10px;
    }

    .form-container button.save {
      background-color: #2ecc71;
      color: white;
    }

    .form-container button.discard {
      background-color: red;
      color: white;
    }

    .form-container .close-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: none;
      border: none;
      font-size: 20px;
      color: red;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <div class="title">Gestión de Miembros</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <!-- Menú lateral -->
  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="miembros.html">Miembros</a>
    <a href="agregar.html">Agregar Miembro</a>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h2>Miembros Registrados</h2>

    <!-- Barra de búsqueda -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar miembro..." onkeyup="filtrarMiembros()">
      <button><img src="https://img.icons8.com/ios/50/000000/search.png" alt="Buscar"></button>

      <!-- Botón de agregar miembro (al lado de la barra de búsqueda) -->
      <button class="add-member-button" onclick="mostrarFormulario()">
        Agregar Miembro
        <img src="https://cdn-icons-png.flaticon.com/512/283/283234.png" alt="Agregar Miembro" width="20" />
      </button>
    </div>

    <!-- Tabla de miembros -->
    <table class="members-table" id="membersTable">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Género</th>
          <th>Dirección</th>
          <th>Asociación</th>
          <th>Cargo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="membersList"></tbody>
    </table>
  </div>

  <!-- Formulario emergente para agregar miembro -->
  <div class="form-overlay" id="formOverlay">
    <div class="form-container">
      <button class="close-btn" onclick="cerrarFormulario()">X</button>
      <h3>Agregar Miembro</h3>
      <input type="text" id="nombre" placeholder="Nombre completo">
      <input type="text" id="codigo" placeholder="Código">
      <input type="text" id="genero" placeholder="Género">
      <input type="text" id="direccion" placeholder="Dirección">
      <input type="text" id="asociacion" placeholder="Asociación">
      <input type="text" id="cargo" placeholder="Cargo">
      <button class="save" onclick="guardarMiembro()">Guardar</button>
      <button class="discard" onclick="cerrarFormulario()">Descartar</button>
    </div>
  </div>

  <script>
    let miembros = JSON.parse(localStorage.getItem('miembros')) || [];

    // Cargar los miembros y mostrarlos en la tabla
    function cargarMiembros() {
      const list = document.getElementById('membersList');
      list.innerHTML = '';

      miembros.forEach((miembro, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td><img src="${miembro.foto || 'https://via.placeholder.com/40'}" alt="Foto"></td>
          <td>${miembro.nombre}</td>
          <td>${miembro.codigo}</td>
          <td>${miembro.genero}</td>
          <td>${miembro.direccion}</td>
          <td>${miembro.asociacion}</td>
          <td>${miembro.cargo}</td>
          <td>
            <button class="edit-btn" onclick="editarMiembro(${index})">Editar</button>
            <button class="delete-btn" onclick="eliminarMiembro(${index})">X</button>
          </td>
        `;

        list.appendChild(row);
      });
    }

    // Mostrar formulario de agregar miembro
    function mostrarFormulario() {
      document.getElementById('formOverlay').style.display = 'flex';
    }

    // Cerrar el formulario emergente
    function cerrarFormulario() {
      document.getElementById('formOverlay').style.display = 'none';
    }

    // Guardar miembro
    function guardarMiembro() {
      const nombre = document.getElementById('nombre').value;
      const codigo = document.getElementById('codigo').value;
      const genero = document.getElementById('genero').value;
      const direccion = document.getElementById('direccion').value;
      const asociacion = document.getElementById('asociacion').value;
      const cargo = document.getElementById('cargo').value;

      if (nombre && codigo && genero && direccion && asociacion && cargo) {
        const nuevoMiembro = {
          nombre,
          codigo,
          genero,
          direccion,
          asociacion,
          cargo,
          foto: 'https://via.placeholder.com/40',  // Foto por defecto
        };

        miembros.push(nuevoMiembro);
        localStorage.setItem('miembros', JSON.stringify(miembros));
        cargarMiembros();
        cerrarFormulario();
      } else {
        alert('Por favor, complete todos los campos.');
      }
    }

    // Eliminar miembro
    function eliminarMiembro(index) {
      miembros.splice(index, 1);
      localStorage.setItem('miembros', JSON.stringify(miembros));
      cargarMiembros();
    }

    // Filtrar miembros por búsqueda
    function filtrarMiembros() {
      const searchInput = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.getElementById('membersList').getElementsByTagName('tr');
      Array.from(rows).forEach(row => {
        const cells = row.getElementsByTagName('td');
        const nombre = cells[1].textContent.toLowerCase();
        const codigo = cells[2].textContent.toLowerCase();

        if (nombre.includes(searchInput) || codigo.includes(searchInput)) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    // Cargar miembros al inicio
    window.onload = cargarMiembros;
  </script>
</body>
</html>
