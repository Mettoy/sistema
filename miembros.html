<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miembros</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a, .sidebar button {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    .sidebar a:hover,
    .sidebar button:hover {
      background-color: #3c5a72;
    }

    .content {
      margin-left: 240px;
      padding: 30px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-right: 10px;
    }

    .add-member-button {
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .add-member-button:hover {
      background-color: #27ae60;
    }

    .add-member-button img {
      margin-left: 10px;
    }

    .members-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    .members-table th, .members-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .members-table th {
      background-color: #34495e;
      color: white;
    }

    .members-table td img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .members-table td input {
      padding: 5px;
      font-size: 16px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .members-table td .edit-btn,
    .members-table td .delete-btn {
      background-color: #f39c12;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .members-table td .edit-btn:hover {
      background-color: #e67e22;
    }

    .members-table td .delete-btn {
      background-color: red;
    }

    .members-table td .delete-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <div class="title">Gestión de Miembros</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <!-- Menú lateral -->
  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="miembros.html">Miembros</a>
    <a href="agregar.html">Agregar Miembro</a>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h2>Miembros Registrados</h2>

    <!-- Barra de búsqueda -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar miembro..." onkeyup="filtrarMiembros()">
    </div>

    <!-- Botón para agregar miembro -->
    <button class="add-member-button" onclick="mostrarFormulario()">
      Agregar Miembro
      <img src="https://img.icons8.com/ios/50/000000/user-plus.png" alt="Agregar Miembro" width="20" />
    </button>

    <!-- Tabla de miembros -->
    <table class="members-table" id="membersTable">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Género</th>
          <th>Dirección</th>
          <th>Asociación</th>
          <th>Cargo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="membersList"></tbody>
    </table>
  </div>

  <script>
    let miembros = JSON.parse(localStorage.getItem('miembros')) || [];

    // Cargar los miembros y mostrarlos en la tabla
    function cargarMiembros() {
      const list = document.getElementById('membersList');
      list.innerHTML = '';

      miembros.forEach((miembro, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td><img src="${miembro.foto || 'https://via.placeholder.com/80'}" alt="Foto de ${miembro.nombre}"></td>
          <td><input type="text" value="${miembro.nombre}" onchange="actualizarCampo(${index}, 'nombre', this.value)"></td>
          <td><input type="text" value="${miembro.codigo}" onchange="actualizarCampo(${index}, 'codigo', this.value)"></td>
          <td><input type="text" value="${miembro.genero}" onchange="actualizarCampo(${index}, 'genero', this.value)"></td>
          <td><input type="text" value="${miembro.direccion}" onchange="actualizarCampo(${index}, 'direccion', this.value)"></td>
          <td><input type="text" value="${miembro.asociacion}" onchange="actualizarCampo(${index}, 'asociacion', this.value)"></td>
          <td><input type="text" value="${miembro.cargo}" onchange="actualizarCampo(${index}, 'cargo', this.value)"></td>
          <td>
            <button class="edit-btn" onclick="editarFoto(${index})">Cambiar Foto</button>
            <button class="delete-btn" onclick="eliminarMiembro(${index})">X</button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    // Filtrar miembros por nombre
    function filtrarMiembros() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.getElementById('membersList').getElementsByTagName('tr');

      Array.from(rows).forEach((row) => {
        const nameCell = row.cells[1];
        if (nameCell) {
          const name = nameCell.textContent.toLowerCase();
          row.style.display = name.includes(query) ? '' : 'none';
        }
      });
    }

    // Actualizar campo de un miembro
    function actualizarCampo(index, campo, valor) {
      miembros[index][campo] = valor;
      localStorage.setItem('miembros', JSON.stringify(miembros));
    }

    // Eliminar miembro
    function eliminarMiembro(index) {
      if (confirm('¿Estás seguro de que deseas eliminar este miembro?')) {
        miembros.splice(index, 1);
        localStorage.setItem('miembros', JSON.stringify(miembros));
        cargarMiembros();
      }
    }

    // Cambiar foto de miembro
    function editarFoto(index) {
      const nuevoFoto = prompt('Introduce la URL de la nueva foto:');
      if (nuevoFoto) {
        miembros[index].foto = nuevoFoto;
        localStorage.setItem('miembros', JSON.stringify(miembros));
        cargarMiembros();
      }
    }

    // Mostrar formulario para agregar miembro (si es necesario)
    function mostrarFormulario() {
      // Aquí puedes agregar lógica si es necesario para mostrar un formulario adicional
    }

    // Cerrar sesión
    function cerrarSesion() {
      localStorage.removeItem('usuarioActual');
      window.location.href = 'index.html';
    }

    // Cargar los miembros al iniciar
    window.onload = function () {
      cargarMiembros();
      const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
      const span = document.getElementById('nombreUsuario');

      if (usuario && usuario.nombreVisible) {
        span.textContent = usuario.nombreVisible;
      } else {
        span.textContent = "Invitado";
      }
    };
  </script>
</body>
</html>
