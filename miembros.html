<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miembros</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a, .sidebar button {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    .sidebar a:hover,
    .sidebar button:hover {
      background-color: #3c5a72;
    }

    .content {
      margin-left: 240px;
      padding: 30px;
    }

    .search-box {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .search-box input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-right: 10px;
    }

    .search-box button {
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-box button img {
      width: 20px;
      height: 20px;
    }

    .add-member-button {
      margin-left: 10px;
      padding: 6px 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    .add-member-button:hover {
      background-color: #27ae60;
    }

    .add-member-button img {
      margin-left: 8px;
    }

    .members-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    .members-table th, .members-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .members-table th {
      background-color: #34495e;
      color: white;
    }

    .members-table td img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .members-table td input {
      padding: 5px;
      font-size: 16px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .members-table td .edit-btn,
    .members-table td .delete-btn {
      background-color: #f39c12;
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .members-table td .edit-btn:hover {
      background-color: #e67e22;
    }

    .members-table td .delete-btn {
      background-color: red;
    }

    .members-table td .delete-btn:hover {
      background-color: #c0392b;
    }

    .members-table td .edit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <div class="title">Gestión de Miembros</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <!-- Menú lateral -->
  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="miembros.html">Miembros</a>
    <a href="agregar.html">Agregar Miembro</a>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h2>Miembros </h2>

    <!-- Barra de búsqueda -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar miembro..." onkeyup="filtrarMiembros()">
      <button><img src="https://img.icons8.com/ios/50/000000/search.png" alt="Buscar"></button>

      <!-- Botón de agregar miembro (al lado de la barra de búsqueda) -->

        Agregar Miembro

      </button>
    </div>

    <!-- Tabla de miembros -->
    <table class="members-table" id="membersTable">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Género</th>
          <th>Dirección</th>
          <th>Asociación</th>
          <th>Cargo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="membersList"></tbody>
    </table>
  </div>

  <script>
    let miembros = JSON.parse(localStorage.getItem('miembros')) || [];

    // Cargar los miembros y mostrarlos en la tabla
    function cargarMiembros() {
      const list = document.getElementById('membersList');
      list.innerHTML = '';

      miembros.forEach((miembro, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td><img src="${miembro.foto || 'https://via.placeholder.com/80'}" alt="Foto de ${miembro.nombre}"></td>
          <td><input type="text" value="${miembro.nombre}" onchange="actualizarCampo(${index}, 'nombre', this.value)" disabled></td>
          <td><input type="text" value="${miembro.codigo}" onchange="actualizarCampo(${index}, 'codigo', this.value)" disabled></td>
          <td><input type="text" value="${miembro.genero}" onchange="actualizarCampo(${index}, 'genero', this.value)" disabled></td>
          <td><input type="text" value="${miembro.direccion}" onchange="actualizarCampo(${index}, 'direccion', this.value)" disabled></td>
          <td><input type="text" value="${miembro.asociacion}" onchange="actualizarCampo(${index}, 'asociacion', this.value)" disabled></td>
          <td><input type="text" value="${miembro.cargo}" onchange="actualizarCampo(${index}, 'cargo', this.value)" disabled></td>
          <td>
            <button class="edit-btn" onclick="editarMiembro(${index})">Editar</button>
            <button class="delete-btn" onclick="eliminarMiembro(${index})">X</button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    // Filtrar miembros por nombre
    function filtrarMiembros() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.getElementById('membersList').getElementsByTagName('tr');

      Array.from(rows).forEach((row) => {
        const nameCell = row.cells[1];
        if (nameCell) {
          const name = nameCell.textContent.toLowerCase();
          row.style.display = name.includes(query) ? '' : 'none';
        }
      });
    }

    // Actualizar campo de un miembro
    function actualizarCampo(index, campo, valor) {
      miembros[index][campo] = valor;
      localStorage.setItem('miembros', JSON.stringify(miembros));
    }

    // Eliminar miembro
    function eliminarMiembro(index) {
      if (confirm('¿Estás seguro de que deseas eliminar este miembro?')) {
        miembros.splice(index, 1);
        localStorage.setItem('miembros', JSON.stringify(miembros));
        cargarMiembros();
      }
    }

    // Activar edición de miembro
    function editarMiembro(index) {
      const row = document.getElementById('membersList').getElementsByTagName('tr')[index];
      const inputs = row.getElementsByTagName('input');
      Array.from(inputs).forEach(input => input.disabled = false);

      // Cambiar el texto del botón de "Editar" a "Guardar"
      row.cells[7].querySelector('.edit-btn').textContent = 'Guardar';
      row.cells[7].querySelector('.edit-btn').onclick = function() {
        guardarEdicion(index);
      };
    }

    // Guardar cambios de edición
    function guardarEdicion(index) {
      const row = document.getElementById('membersList').getElementsByTagName('tr')[index];
      const inputs = row.getElementsByTagName('input');

      Array.from(inputs).forEach(input => input.disabled = true);
      row.cells[7].querySelector('.edit-btn').textContent = 'Editar';
      row.cells[7].querySelector('.edit-btn').onclick = function() {
        editarMiembro(index);
      };

      // Guardar cambios en localStorage
      const miembro = miembros[index];
      Array.from(inputs).forEach(input => {
        const field = input.name || input.parentNode.textContent;
        if (field) {
          miembro[field] = input.value;
        }
      });

      localStorage.setItem('miembros', JSON.stringify(miembros));
    }

    // Mostrar formulario para agregar miembro
    function mostrarFormulario() {
      // Lógica para mostrar un formulario emergente para agregar un nuevo miembro
    }

    // Cargar miembros al inicio
    window.onload = cargarMiembros;
  </script>
</body>
</html>
