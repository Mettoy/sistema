<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
    }

    /* Estilo del topbar */
    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .topbar .title {
      font-size: 18px;
    }

    .topbar .usuario {
      font-weight: bold;
    }

    /* Estilo del sidebar */
    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a, .sidebar button {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    .sidebar a:hover,
    .sidebar button:hover {
      background-color: #3c5a72;
    }

    /* Estilo del contenido */
    .content {
      margin-left: 240px;
      padding: 30px;
    }

    /* Estilo de los cuadros de usuario */
    .user-entry {
      background-color: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
    }

    .user-entry img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-right: 20px;
    }

    .user-details {
      flex-grow: 1;
    }

    .user-details p {
      margin: 5px 0;
    }

    .user-details strong {
      font-size: 16px;
    }

    .user-controls button {
      margin-right: 5px;
      padding: 8px 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .user-controls button:hover {
      background-color: #2980b9;
    }

    /* Estilo del campo de búsqueda */
    .search-box {
      margin-bottom: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .search-box input {
      padding: 8px 12px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <div class="title">Gestión de Usuarios</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <!-- Menú lateral -->
  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="usuarios.html">Usuarios</a>
    <a href="agregar.html">Agregar Usuario</a>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h2>Usuarios Registrados</h2>

    <!-- Campo de búsqueda -->
    <div class="search-box">
      <input type="text" id="buscarUsuario" placeholder="Buscar usuario..." oninput="buscarUsuarios()">
    </div>

    <!-- Lista de usuarios -->
    <div id="usuariosList"></div>
  </div>

  <script>
    window.onload = function () {
      const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
      const span = document.getElementById('nombreUsuario');

      if (usuario && usuario.nombreVisible) {
        span.textContent = usuario.nombreVisible;
      } else if (usuario && usuario.nombre) {
        span.textContent = usuario.nombre;
      } else {
        span.textContent = "Invitado";
      }

      cargarUsuarios();
    };

    // Cargar y mostrar los usuarios
    function cargarUsuarios() {
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      const listaUsuarios = document.getElementById('usuariosList');
      listaUsuarios.innerHTML = '';

      usuarios.forEach((usuario, index) => {
        const div = document.createElement('div');
        div.className = 'user-entry';

        const foto = usuario.foto || 'https://via.placeholder.com/80'; // Foto por defecto

        div.innerHTML = `
          <img src="${foto}" alt="Foto de ${usuario.nombre}">
          <div class="user-details">
            <strong>${usuario.nombre}</strong>
            <p><strong>Código:</strong> ${usuario.codigo}</p>
            <p><strong>Género:</strong> ${usuario.genero}</p>
            <p><strong>Dirección:</strong> ${usuario.direccion}</p>
            <p><strong>Asociación:</strong> ${usuario.asociacion}</p>
            <p><strong>Cargo:</strong> ${usuario.cargo}</p>
          </div>
          <div class="user-controls">
            <button onclick="verDetalles(${index})">Ver Detalles</button>
            <button onclick="eliminarUsuario(${index})">Eliminar</button>
          </div>
        `;
        listaUsuarios.appendChild(div);
      });
    }

    // Función para filtrar usuarios por búsqueda
    function buscarUsuarios() {
      const filtro = document.getElementById('buscarUsuario').value.toLowerCase();
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      const listaUsuarios = document.getElementById('usuariosList');
      listaUsuarios.innerHTML = '';

      const usuariosFiltrados = usuarios.filter(usuario =>
        usuario.nombre.toLowerCase().includes(filtro) ||
        usuario.codigo.toLowerCase().includes(filtro)
      );

      usuariosFiltrados.forEach((usuario, index) => {
        const div = document.createElement('div');
        div.className = 'user-entry';

        const foto = usuario.foto || 'https://via.placeholder.com/80';

        div.innerHTML = `
          <img src="${foto}" alt="Foto de ${usuario.nombre}">
          <div class="user-details">
            <strong>${usuario.nombre}</strong>
            <p><strong>Código:</strong> ${usuario.codigo}</p>
            <p><strong>Género:</strong> ${usuario.genero}</p>
            <p><strong>Dirección:</strong> ${usuario.direccion}</p>
            <p><strong>Asociación:</strong> ${usuario.asociacion}</p>
            <p><strong>Cargo:</strong> ${usuario.cargo}</p>
          </div>
          <div class="user-controls">
            <button onclick="verDetalles(${index})">Ver Detalles</button>
            <button onclick="eliminarUsuario(${index})">Eliminar</button>
          </div>
        `;
        listaUsuarios.appendChild(div);
      });
    }

    // Función para ver detalles de un usuario
    function verDetalles(index) {
      const usuarios = JSON.parse(localStorage.getItem('usuarios'));
      const usuario = usuarios[index];

      alert(`
        Nombre: ${usuario.nombre}
        Código: ${usuario.codigo}
        Género: ${usuario.genero}
        Dirección: ${usuario.direccion}
        Asociación: ${usuario.asociacion}
        Cargo: ${usuario.cargo}
        Foto: ${usuario.foto || 'No disponible'}
      `);
    }

    // Función para eliminar usuario
    function eliminarUsuario(index) {
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
        usuarios.splice(index, 1);
        localStorage.setItem('usuarios', JSON.stringify(usuarios));
        cargarUsuarios();
      }
    }

    // Función para cerrar sesión
    function cerrarSesion() {
      localStorage.removeItem('usuarioActual');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
