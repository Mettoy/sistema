<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 10px 20px;
      text-align: right;
      font-size: 16px;
    }

    .sidebar {
      width: 200px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      left: 0;
      bottom: 0;
      padding: 20px;
      color: white;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
    }

    .content {
      margin-left: 220px;
      padding: 20px;
    }

    .nombre-usuario {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="topbar">
    Bienvenido, <span id="nombreUsuario" class="nombre-usuario">Cargando...</span>
  </div>

  <div class="sidebar">
    <h3>Menú</h3>
    <a href="inicio.html">Inicio</a>
    <a href="agregar.html">Agregar Usuario</a>
  </div>

  <div class="content">
    <h2>Inicio</h2>
    <p>Esta es la página de bienvenida.</p>
  </div>

  <script>
    window.onload = function () {
      const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
      const nombreSpan = document.getElementById('nombreUsuario');

      if (usuario && usuario.nombreVisible) {
        nombreSpan.textContent = usuario.nombreVisible;
      } else if (usuario && usuario.nombre) {
        nombreSpan.textContent = usuario.nombre;
      } else {
        nombreSpan.textContent = "Invitado";
      }
    };
  </script>

</body>
</html>
