<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
    }

    /* Barra superior */
    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .topbar .title {
      font-size: 18px;
    }

    .topbar .usuario {
      font-weight: bold;
    }

    /* Menú lateral */
    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
      transition: all 0.3s;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: background 0.2s;
    }

    .sidebar a:hover {
      background-color: #3c5a72;
    }

    /* Contenido principal */
    .content {
      margin-left: 220px;
      padding: 30px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="topbar">
    <div class="title">Panel principal</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <!-- Menú lateral -->
  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="agregar.html">Agregar Usuario</a>
  </div>

  <!-- Contenido -->
  <div class="content">
    <h2>Inicio</h2>
    <p>Esta es la página principal del sistema. Desde aquí puedes navegar usando el menú lateral.</p>
  </div>

  <!-- Script para mostrar el nombre visible -->
  <script>
    window.onload = function () {
      const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
      const span = document.getElementById('nombreUsuario');

      if (usuario && usuario.nombreVisible) {
        span.textContent = usuario.nombreVisible;
      } else if (usuario && usuario.nombre) {
        span.textContent = usuario.nombre;
      } else {
        span.textContent = 'Invitado';
      }
    };
  </script>

</body>
</html>
