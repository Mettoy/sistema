<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
    }

    .topbar {
      background-color: #2c3e50;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
    }

    .topbar .title {
      font-size: 18px;
    }

    .topbar .usuario {
      font-weight: bold;
    }

    .sidebar {
      width: 220px;
      background-color: #34495e;
      position: fixed;
      top: 50px;
      bottom: 0;
      left: 0;
      padding-top: 20px;
      color: white;
    }

    .sidebar a, .sidebar button {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    .sidebar a:hover,
    .sidebar button:hover {
      background-color: #3c5a72;
    }

    .content {
      margin-left: 240px;
      padding: 30px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">Panel principal</div>
    <div class="usuario">Bienvenido, <span id="nombreUsuario">...</span></div>
  </div>

  <div class="sidebar">
    <a href="inicio.html">Inicio</a>
    <a href="agregar.html">Agregar Usuario</a>
    <a href="miembros.html">Miembro</a>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <div class="content">
    <h2>Inicio</h2>
    <p>Esta es la página principal del sistema. Desde aquí puedes navegar usando el menú lateral.</p>
  </div>

  <script>
    window.onload = function () {
      const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
      const span = document.getElementById('nombreUsuario');

      if (usuario && usuario.nombreVisible) {
        span.textContent = usuario.nombreVisible;
      } else if (usuario && usuario.nombre) {
        span.textContent = usuario.nombre;
      } else {
        span.textContent = "Invitado";
      }
    };

    function cerrarSesion() {
      localStorage.removeItem('usuarioActual');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
